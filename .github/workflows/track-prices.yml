name: Monitorar precos Recife-Curitiba

on:
  schedule:
    # 09:00 e 21:00 no horario de Brasilia (UTC-3) -> 12:00 e 00:00 UTC
    - cron: '0 12 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      quick:
        description: 'Consultar so o par de datas padrao (mais rapido)'
        type: boolean
        default: false
      airline:
        description: 'Testar so uma companhia (util para depurar um scraper)'
        type: choice
        default: todas
        options: [todas, azul, gol, latam]

permissions:
  contents: write

concurrency:
  group: track-prices
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      QUICK: ${{ github.event.inputs.quick || 'false' }}
      AIRLINE: ${{ github.event.inputs.airline || 'todas' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegador Chromium
        run: npx playwright install --with-deps chromium

      - name: Rodar scrapers
        id: scrape
        continue-on-error: true
        run: |
          ARGS=""
          [ "$QUICK" = "true" ] && ARGS="$ARGS --quick"
          if [ -n "$AIRLINE" ] && [ "$AIRLINE" != "todas" ]; then
            ARGS="$ARGS --airline=$AIRLINE"
          fi
          npm run scrape -- $ARGS

      - name: Gerar dashboard
        run: npm run build-dashboard

      - name: Enviar artefatos de debug (se houve falha)
        if: steps.scrape.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: debug-scrape-${{ github.run_id }}
          path: debug/
          retention-days: 7
          if-no-files-found: ignore

      - name: Commitar dados e dashboard atualizados
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/history.json docs/index.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Sem mudancas para commitar."
          else
            git commit -m "chore: atualizar precos REC-CWB [skip ci]"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Enviar alteracoes para o repositorio
        if: steps.commit.outputs.changed == 'true'
        run: git push

      - name: Marcar job como falho se o scraper falhou
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::warning::O scraper falhou nesta execucao. Veja o artefato de debug e/ou registre um preco manualmente com 'npm run add-price'."
          exit 1
